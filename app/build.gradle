plugins {
    id 'com.android.application'
}

android {
    namespace 'com.valen.home'
    compileSdk 34

    defaultConfig {
        applicationId "com.valen.home"
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
