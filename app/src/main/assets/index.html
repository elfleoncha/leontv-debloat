<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @font-face{font-family:'Inter';src:url(fonts/inter-var.woff2) format('woff2');
    font-weight:100 900;font-style:normal;font-display:swap}
  *:focus{outline:none}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#04050a;color:#fff;
    font-family:'Inter','Roboto',sans-serif;font-feature-settings:'ss01','cv11'}

  #wall{position:fixed;inset:0;background:#04050a url(wallpaper.jpg) center/cover no-repeat;
    transition:opacity .5s}
  #scrim{position:fixed;inset:0;
    background:
      linear-gradient(270deg, rgba(4,5,10,.95) 0%, rgba(4,5,10,.80) 30%, rgba(4,5,10,.32) 60%, rgba(4,5,10,.15) 100%),
      linear-gradient(180deg, rgba(4,5,10,.45) 0%, transparent 26%, transparent 72%, rgba(4,5,10,.70) 100%)}

  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-end;
    padding-right:7vw;transition:padding .25s ease}
  .stage.pos-left{justify-content:flex-start;padding-left:7vw;padding-right:0}
  .stage.pos-center{justify-content:center;padding-left:0;padding-right:0}
  .stage.pos-right{justify-content:flex-end;padding-left:0;padding-right:7vw}
  .left.al-left{align-items:flex-start;text-align:left}
  .left.al-center{align-items:center;text-align:center}
  .left.al-right{align-items:flex-end;text-align:right}
  .cards.pos-left{justify-content:flex-start}
  .cards.pos-center{justify-content:center}
  .cards.pos-right{justify-content:flex-end}
  .left{display:flex;flex-direction:column;align-items:flex-end;text-align:right}

  .clock{font-weight:200;font-size:13vw;line-height:.84;letter-spacing:-.045em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 1vh 8vh rgba(0,0,0,.6)}
  .clock.s{font-size:10vw}
  .clock.l{font-size:16vw}
  .date{margin-top:2vh;font-size:1.25vw;letter-spacing:.42em;text-transform:uppercase;
    color:rgba(255,255,255,.58);font-weight:450;padding-right:.42em;
    text-shadow:0 1vh 3vh rgba(0,0,0,.65)}
  .date.hidden{display:none}

  .cards{display:flex;gap:2.2vw;margin-top:8vh;justify-content:flex-end}
  .card{display:flex;align-items:center;gap:1.9vw;padding:2.6vh 2.8vw;border-radius:2.8vh;
    background:linear-gradient(155deg, rgba(255,255,255,.13), rgba(255,255,255,.045));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 2.4vh 7vh rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14);
    transition:transform .16s cubic-bezier(.2,.8,.2,1), background .16s, border-color .16s;
    will-change:transform;backface-visibility:hidden}
  .card.focused{transform:scale(1.07);
    background:linear-gradient(155deg, rgba(255,255,255,.32), rgba(255,255,255,.12));
    border-color:rgba(255,255,255,.6);
    box-shadow:0 2.4vh 6vh rgba(0,0,0,.55), 0 0 5vh rgba(150,180,255,.28)}
  .stack{display:flex;align-items:center}
  .stack img{width:5vh;width:5.2vh;height:5.2vh;border-radius:1.6vh;box-shadow:0 1.2vh 3vh rgba(0,0,0,.65);display:block}
  .stack img+img{margin-left:-2vh}
  .name{font-size:1.1vw;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(255,255,255,.94);font-weight:550;padding-right:.34em}

  .gear{position:fixed;top:4.5vh;right:4.5vw;width:6.4vh;height:6.4vh;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.6);font-size:2.5vh;transition:all .18s ease}
  .gear.focused{background:rgba(255,255,255,.22);color:#fff;transform:scale(1.12);
    border-color:rgba(255,255,255,.4);box-shadow:0 0 3vh rgba(160,190,255,.22)}

  #volhud{position:fixed;left:50%;bottom:7vh;transform:translateX(-50%) translateY(1vh);
    display:flex;align-items:center;gap:1.1vw;padding:1.5vh 1.8vw;border-radius:2.2vh;
    background:linear-gradient(160deg, rgba(26,30,42,.92), rgba(10,12,18,.94));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 2vh 6vh rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10);
    opacity:0;pointer-events:none;transition:opacity .16s ease, transform .16s ease;z-index:50}
  #volhud.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #volhud .vbar{width:22vw;height:1vh}
  #volhud .vbar i{background:linear-gradient(90deg, rgba(255,255,255,.75), #fff)}
  #volhud .vnum{font-size:1.05vw;letter-spacing:.18em;color:rgba(255,255,255,.85);
    min-width:3vw;text-align:right;font-variant-numeric:tabular-nums}
  #volhud svg{opacity:.85;flex:0 0 auto}

  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(2,3,6,.86)}
  #overlay.on{display:flex;animation:fade .16s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .panel{width:70vw;max-height:88vh;overflow-y:auto;overflow-x:hidden;
    scrollbar-width:none;padding:3.4vh 3.4vw 2.6vh;border-radius:3vh;
    background:linear-gradient(165deg, rgba(26,30,42,.98), rgba(9,11,17,.99));
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 6vh 16vh rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.07)}
  .ptitle{font-size:1.4vw;letter-spacing:.4em;text-transform:uppercase;
    color:rgba(255,255,255,.55);margin-bottom:3vh}

  /* app grid inside folders */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw}
  .app{display:flex;flex-direction:column;align-items:center;gap:1.5vh;
    padding:1.6vh .5vw;border-radius:2vh;transition:transform .13s ease, background .13s ease;
    will-change:transform;backface-visibility:hidden}
  .app img{width:7.2vh;height:7.2vh;border-radius:1.8vh;box-shadow:0 1.4vh 3vh rgba(0,0,0,.5)}
  .app span{font-size:.95vw;color:rgba(255,255,255,.8);text-align:center;max-width:11vw;line-height:1.35}
  .app.focused{background:rgba(255,255,255,.13);transform:scale(1.07)}
  .app.focused span{color:#fff}

  /* settings rows */
  .rows{display:flex;flex-direction:column}
  .row{display:flex;align-items:center;justify-content:space-between;
    padding:1.45vh 1.6vw;border-radius:1.6vh;border-left:3px solid transparent;
    transition:background .16s ease, border-color .16s ease}
  .row .lab{font-size:1.15vw;color:rgba(255,255,255,.9);letter-spacing:.04em}
  .row .val{font-size:1.05vw;letter-spacing:.28em;color:rgba(255,255,255,.55);
    display:flex;align-items:center;gap:.9vw}
  .row .val .arw{opacity:.45;font-size:1.2vw}
  .row.focused{background:rgba(255,255,255,.10);border-left-color:rgba(255,255,255,.75)}
  .row.focused .val{color:#fff}
  .vbar{width:13vw;height:.85vh;border-radius:1vh;background:rgba(255,255,255,.14);overflow:hidden}
  .vbar i{display:block;height:100%;background:rgba(255,255,255,.85);border-radius:1vh;transition:width .1s linear}
  .vnum{min-width:4.5vw;text-align:right;font-variant-numeric:tabular-nums}
  .row.focused .val .arw{opacity:.9}
  .sect{margin:1.8vh 0 .4vh;font-size:.82vw;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(255,255,255,.34);padding-left:.4vw}
  .sect:first-child{margin-top:0}
  .hint{margin-top:2.6vh;font-size:.85vw;letter-spacing:.22em;color:rgba(255,255,255,.3);
    text-transform:uppercase;text-align:center}
</style>
</head>
<body>
<div id="wall"></div>
<div id="scrim"></div>

<div class="stage">
  <div class="left">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <div class="cards" id="cards"></div>
  </div>
</div>

<div class="gear" id="gear">&#9881;</div>

<div id="volhud">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z" fill="#ffffff"/>
    <path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M19 6a8.5 8.5 0 0 1 0 12" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".65"/>
  </svg>
  <div class="vbar"><i id="volfill" style="width:0%"></i></div>
  <span class="vnum" id="volnum">0</span>
</div>

<div id="overlay">
  <div class="panel">
    <div class="ptitle" id="ptitle"></div>
    <div class="grid" id="grid"></div>
    <div class="rows" id="rows"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<script>
window.onerror = function (m, s, l) { try { console.log('JSERR ' + m + ' @' + l); } catch (e) {} };
(function () {
  var cardsEl = document.getElementById('cards');
  var gearEl = document.getElementById('gear');
  var overlay = document.getElementById('overlay');
  var gridEl = document.getElementById('grid');
  var rowsEl = document.getElementById('rows');
  var ptitle = document.getElementById('ptitle');
  var hint = document.getElementById('hint');
  var wall = document.getElementById('wall');
  var volhud = document.getElementById('volhud');
  var volfill = document.getElementById('volfill');
  var volnum = document.getElementById('volnum');

  var mode = 'home';
  var focusables = [];
  var fi = 0;
  var overlayItems = [];
  var oi = 0;
  var rowDefs = [];
  var ri = 0;
  var groups = [];
  var moveStage = null;
  var movePkg = null;
  var moveDest = 0;
  var ai = 0;
  var curFolder = '';
  var appIndex = {};
  var sysInfo = {};
  var volTimer = null;

  var cfg = {
    h24: true, showDate: true, size: 'm', wallpaper: true,
    clockPos: 'right', appsPos: 'right', sounds: true, lang: 'es'
  };
  try {
    var saved = JSON.parse(localStorage.getItem('valenhome.cfg') || 'null');
    if (saved) { for (var key in saved) { if (cfg.hasOwnProperty(key)) cfg[key] = saved[key]; } }
  } catch (e) {}
  function saveCfg() { try { localStorage.setItem('valenhome.cfg', JSON.stringify(cfg)); } catch (e) {} }

  var moves = {};
  try { moves = JSON.parse(localStorage.getItem('valenhome.moves') || '{}') || {}; } catch (e) {}
  function saveMoves() { try { localStorage.setItem('valenhome.moves', JSON.stringify(moves)); } catch (e) {} }

  var K = ['ajustes','reloj','sonido','red','sistema','apps','fondo','avanzado','hora','fecha','tam',
    'posReloj','posApps','fondoT','volumen','sonidos','fondoMovil','cambiarRed','memoria','almacenamiento',
    'modelo','android','appsInstaladas','gestionar','ajustesSistema','pantallaSonido','acerca','idioma',
    'si','no','izq','centro','dcha','imagen','liso','abre','mueve','vuelve','cambia','mover','ver',
    'appsCat','musica','juegos','fotos','social','noticias','mapas','accesibilidad','tienda'];

  var L = {
    es: ['Ajustes','Reloj','Sonido','Red','Sistema','Aplicaciones','Fondo','Avanzado','Formato de hora','Mostrar fecha','Tamaño del reloj','Posición del reloj','Posición de apps','Fondo de pantalla','Volumen','Sonidos del sistema','Fondo desde el móvil','Cambiar de red','Memoria libre','Almacenamiento','Modelo','Android','Apps instaladas','Gestionar aplicaciones','Ajustes del sistema','Pantalla y sonido','Acerca del dispositivo','Idioma','SÍ','NO','IZQ','CENTRO','DCHA','IMAGEN','LISO','OK abre','MOVER cambia','ATRÁS vuelve','cambia','MOVER','VER','APPS','MÚSICA','JUEGOS','FOTOS','SOCIAL','NOTICIAS','MAPAS','ACCESIBILIDAD','TIENDA'],
    en: ['Settings','Clock','Sound','Network','System','Apps','Wallpaper','Advanced','Time format','Show date','Clock size','Clock position','Apps position','Wallpaper','Volume','System sounds','Wallpaper from phone','Change network','Free memory','Storage','Model','Android','Apps installed','Manage apps','System settings','Display and sound','About device','Language','YES','NO','LEFT','CENTER','RIGHT','IMAGE','PLAIN','OK opens','MOVER moves','BACK returns','change','MOVE','WATCH','APPS','MUSIC','GAMES','PHOTOS','SOCIAL','NEWS','MAPS','ACCESSIBILITY','STORE'],
    it: ['Impostazioni','Orologio','Audio','Rete','Sistema','App','Sfondo','Avanzate','Formato ora','Mostra data','Dimensione orologio','Posizione orologio','Posizione app','Sfondo','Volume','Suoni di sistema','Sfondo dal telefono','Cambia rete','Memoria libera','Archiviazione','Modello','Android','App installate','Gestisci app','Impostazioni di sistema','Schermo e audio','Info dispositivo','Lingua','SÌ','NO','SINISTRA','CENTRO','DESTRA','IMMAGINE','PIENO','OK apre','MOVER sposta','INDIETRO','cambia','SPOSTA','GUARDA','APP','MUSICA','GIOCHI','FOTO','SOCIAL','NOTIZIE','MAPPE','ACCESSIBILITÀ','NEGOZIO'],
    fr: ['Réglages','Horloge','Son','Réseau','Système','Applications','Fond','Avancé','Format heure','Afficher la date','Taille horloge','Position horloge','Position applis','Fond d\u2019écran','Volume','Sons système','Fond depuis le téléphone','Changer de réseau','Mémoire libre','Stockage','Modèle','Android','Applis installées','Gérer les applis','Réglages système','Affichage et son','À propos','Langue','OUI','NON','GAUCHE','CENTRE','DROITE','IMAGE','UNI','OK ouvre','MOVER déplace','RETOUR','change','DÉPLACER','REGARDER','APPLIS','MUSIQUE','JEUX','PHOTOS','SOCIAL','ACTUS','CARTES','ACCESSIBILITÉ','STORE'],
    de: ['Einstellungen','Uhr','Ton','Netzwerk','System','Apps','Hintergrund','Erweitert','Zeitformat','Datum anzeigen','Uhrgröße','Uhrposition','App-Position','Hintergrundbild','Lautstärke','Systemtöne','Hintergrund vom Handy','Netzwerk wechseln','Freier Speicher','Speicher','Modell','Android','Installierte Apps','Apps verwalten','Systemeinstellungen','Bild und Ton','Über das Gerät','Sprache','JA','NEIN','LINKS','MITTE','RECHTS','BILD','PLAIN','OK öffnet','MOVER verschiebt','ZURÜCK','ändern','VERSCHIEBEN','ANSEHEN','APPS','MUSIK','SPIELE','FOTOS','SOCIAL','NEWS','KARTEN','BARRIEREFREI','STORE'],
    pt: ['Definições','Relógio','Som','Rede','Sistema','Aplicações','Fundo','Avançado','Formato hora','Mostrar data','Tamanho relógio','Posição relógio','Posição apps','Fundo de ecrã','Volume','Sons do sistema','Fundo do telemóvel','Mudar de rede','Memória livre','Armazenamento','Modelo','Android','Apps instaladas','Gerir apps','Definições do sistema','Ecrã e som','Sobre o dispositivo','Idioma','SIM','NÃO','ESQ','CENTRO','DIR','IMAGEM','LISO','OK abre','MOVER move','VOLTAR','muda','MOVER','VER','APPS','MÚSICA','JOGOS','FOTOS','SOCIAL','NOTÍCIAS','MAPAS','ACESSIBILIDADE','LOJA']
  };

  function t(key) {
    var i = K.indexOf(key);
    var lang = L[cfg.lang] || L.es;
    return (i >= 0 && lang[i]) ? lang[i] : (L.es[i] || key);
  }

  var CATK = { 'VER': 'ver', 'APPS': 'appsCat', 'MÚSICA': 'musica', 'JUEGOS': 'juegos', 'FOTOS': 'fotos',
    'SOCIAL': 'social', 'NOTICIAS': 'noticias', 'MAPAS': 'mapas', 'ACCESIBILIDAD': 'accesibilidad', 'TIENDA': 'tienda' };

  function catName(n) { var k = CATK[n]; return k ? t(k) : n; }

  function tickSound() { if (!cfg.sounds) return; try { valen.tick(); } catch (e) {} }
  function openSound() { if (!cfg.sounds) return; try { valen.openSound(); } catch (e) {} }

  function applyCfg() {
    document.getElementById('clock').className = 'clock' + (cfg.size === 's' ? ' s' : (cfg.size === 'l' ? ' l' : ''));
    document.getElementById('date').className = 'date' + (cfg.showDate ? '' : ' hidden');
    wall.style.opacity = cfg.wallpaper ? '1' : '0';
    document.querySelector('.stage').className = 'stage pos-' + (cfg.clockPos || 'right');
    document.querySelector('.left').className = 'left al-' + (cfg.clockPos || 'right');
    document.getElementById('cards').className = 'cards pos-' + (cfg.appsPos || 'right');
    tick(true);
  }

  var lastClock = '', lastDate = '';
  function tick(force) {
    var d = new Date(), h = d.getHours(), mm = ('0' + d.getMinutes()).slice(-2), tc;
    if (cfg.h24) tc = ('0' + h).slice(-2) + ':' + mm;
    else { var h12 = h % 12; if (h12 === 0) h12 = 12; tc = h12 + ':' + mm; }
    if (tc !== lastClock || force) { lastClock = tc; document.getElementById('clock').textContent = tc; }
    var ds = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/,/g, '');
    ds = ds.charAt(0).toUpperCase() + ds.slice(1);
    if (ds !== lastDate || force) { lastDate = ds; document.getElementById('date').textContent = ds; }
  }

  function setFocus(i) {
    if (!focusables.length) return;
    focusables.forEach(function (el) { el.classList.remove('focused'); });
    var prev = fi;
    fi = (i + focusables.length) % focusables.length;
    focusables[fi].classList.add('focused');
    if (prev !== fi) tickSound();
  }

  var CAT = { 0: 'JUEGOS', 1: 'MÚSICA', 2: 'VER', 3: 'FOTOS', 4: 'SOCIAL', 5: 'NOTICIAS', 6: 'MAPAS', 7: 'APPS', 8: 'ACCESIBILIDAD' };

  function guessCat(a) {
    if (typeof a.cat === 'number' && CAT[a.cat]) return CAT[a.cat];
    var p = (a.pkg + ' ' + (a.label || '')).toLowerCase();
    if (/netflix|hbo|disney|prime|youtube|filmin|mitele|mediaset|atres|rtve|dazn|movistar|crunchyroll|plex|vlc|kodi|stremio|stream|video|player|tv\b/.test(p)) return 'VER';
    if (/spotify|music|radio|audio|podcast|sound/.test(p)) return 'MÚSICA';
    if (/game|juego|juegos/.test(p)) return 'JUEGOS';
    return 'APPS';
  }

  function addCard(name, items) {
    var card = document.createElement('div');
    card.className = 'card';
    var stack = document.createElement('div');
    stack.className = 'stack';
    var shown = 0;
    items.forEach(function (a) {
      if (shown >= 3 || !a.icon) return;
      var img = document.createElement('img');
      img.src = a.icon;
      stack.appendChild(img);
      shown++;
    });
    var nm = document.createElement('div');
    nm.className = 'name';
    nm.textContent = catName(name);
    card.appendChild(stack);
    card.appendChild(nm);
    card.addEventListener('click', function () { openList(name, items); });
    cardsEl.appendChild(card);
    focusables.push(card);
  }

  function buildFolders() {
    var prev = fi;
    var index = {};
    var sig = '';
    try {
      JSON.parse(valen.all()).forEach(function (a) { index[a.pkg] = a; sig += a.cmp + '|'; });
    } catch (e) {}
    appIndex = index;
    if (sig === window.__sig && cardsEl.childElementCount > 0) return;
    window.__sig = sig;

    cardsEl.innerHTML = '';
    focusables = [];
    var order = [];
    var byName = {};
    function bucket(n) { if (!byName[n]) { byName[n] = []; order.push(n); } return byName[n]; }

    var data = {};
    try { data = JSON.parse(valen.folders()); } catch (e) {}
    (data.folders || []).forEach(function (f) {
      var b = bucket(f.name);
      (f.apps || []).forEach(function (p) {
        if (!index[p]) return;
        if (moves[p] && moves[p] !== f.name) return;
        b.push(index[p]);
        index[p]._used = true;
      });
    });

    Object.keys(index).forEach(function (p) {
      var a = index[p];
      if (a._used || p === 'com.valen.home') return;
      bucket(moves[p] || guessCat(a)).push(a);
    });
    Object.keys(index).forEach(function (p) { index[p]._used = false; });

    groups = [];
    order.forEach(function (n) {
      var items = byName[n].sort(function (a, b) { return (a.label || '').localeCompare(b.label || ''); });
      if (!items.length) return;
      groups.push(n);
      addCard(n, items);
    });

    focusables.push(gearEl);
    if (mode === 'home') setFocus(prev || 0);
  }

  function showOverlay(title) {
    ptitle.textContent = title;
    gridEl.innerHTML = '';
    rowsEl.innerHTML = '';
    overlay.classList.add('on');
    valen.setOverlay(true);
  }

  function openList(name, items) {
    mode = 'folder';
    moveStage = null;
    curFolder = name;
    showOverlay(catName(name));
    gridEl.style.display = 'grid';
    rowsEl.style.display = 'none';
    hint.textContent = 'OK · ' + t('mover') + ' · ' + t('vuelve');
    openSound();
    overlayItems = [];
    oi = 0;

    items.forEach(function (a) {
      if (!a || !a.icon) return;
      var el = document.createElement('div');
      el.className = 'app';
      var img = document.createElement('img');
      img.src = a.icon;
      var sp = document.createElement('span');
      sp.textContent = a.label;
      el.appendChild(img);
      el.appendChild(sp);
      el.addEventListener('click', function () { if (!moveStage) launch(a); });
      gridEl.appendChild(el);
      overlayItems.push({ el: el, pkg: a.pkg, cmp: a.cmp, label: a.label });
    });
    if (!overlayItems.length) return;

    var mv = document.createElement('div');
    mv.className = 'app';
    var mvi = document.createElement('div');
    mvi.style.cssText = 'width:7.2vh;height:7.2vh;border-radius:1.8vh;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.10);font-size:3vh;color:rgba(255,255,255,.7)';
    mvi.textContent = '\u21C4';
    var mvs = document.createElement('span');
    mvs.textContent = t('mover');
    mv.appendChild(mvi);
    mv.appendChild(mvs);
    mv.addEventListener('click', function () { if (!moveStage) enterMove(); });
    gridEl.appendChild(mv);
    overlayItems.push({ el: mv, isMove: true });

    overlayItems[0].el.classList.add('focused');
  }

  function fmtMB(mb) {
    if (!mb && mb !== 0) return '—';
    return mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB';
  }

  function openSettings() {
    mode = 'settings';
    moveStage = null;
    showOverlay(t('ajustes'));
    gridEl.style.display = 'none';
    rowsEl.style.display = 'flex';
    hint.textContent = '◀ ▶ ' + t('cambia') + ' · OK · ' + t('vuelve');
    openSound();

    try { sysInfo = JSON.parse(valen.info()); } catch (e) { sysInfo = {}; }

    var spec = [
      { type: 'section', label: t('ajustes') },
      { label: t('idioma'), type: 'seg', values: ['ES', 'EN', 'IT', 'FR', 'DE', 'PT'],
        get: function () { return ['es', 'en', 'it', 'fr', 'de', 'pt'].indexOf(cfg.lang || 'es'); },
        set: function (i) { cfg.lang = ['es', 'en', 'it', 'fr', 'de', 'pt'][i]; } },

      { type: 'section', label: t('reloj') },
      { label: t('hora'), type: 'seg', values: ['24 H', '12 H'],
        get: function () { return cfg.h24 ? 0 : 1; }, set: function (i) { cfg.h24 = (i === 0); } },
      { label: t('fecha'), type: 'seg', values: [t('si'), t('no')],
        get: function () { return cfg.showDate ? 0 : 1; }, set: function (i) { cfg.showDate = (i === 0); } },
      { label: t('tam'), type: 'seg', values: ['S', 'M', 'L'],
        get: function () { return cfg.size === 's' ? 0 : (cfg.size === 'l' ? 2 : 1); },
        set: function (i) { cfg.size = ['s', 'm', 'l'][i]; } },
      { label: t('posReloj'), type: 'seg', values: [t('izq'), t('centro'), t('dcha')],
        get: function () { return ['left', 'center', 'right'].indexOf(cfg.clockPos); },
        set: function (i) { cfg.clockPos = ['left', 'center', 'right'][i]; } },
      { label: t('posApps'), type: 'seg', values: [t('izq'), t('centro'), t('dcha')],
        get: function () { return ['left', 'center', 'right'].indexOf(cfg.appsPos); },
        set: function (i) { cfg.appsPos = ['left', 'center', 'right'][i]; } },

      { type: 'section', label: t('fondo') },
      { label: t('fondoT'), type: 'seg', values: [t('imagen'), t('liso')],
        get: function () { return cfg.wallpaper ? 0 : 1; }, set: function (i) { cfg.wallpaper = (i === 0); } },

      { type: 'section', label: t('sonido') },
      { label: t('volumen'), type: 'vol' },
      { label: t('sonidos'), type: 'seg', values: [t('si'), t('no')],
        get: function () { return cfg.sounds ? 0 : 1; }, set: function (i) { cfg.sounds = (i === 0); } },

      { type: 'section', label: t('red') },
      { label: t('fondoMovil'), type: 'info',
        value: function () { return sysInfo.ip ? ('http://' + sysInfo.ip + ':8756') : '—'; } },
      { label: t('cambiarRed'), type: 'act', act: function () { valen.open('wifi'); } },

      { type: 'section', label: t('sistema') },
      { label: t('memoria'), type: 'info',
        value: function () { return fmtMB(sysInfo.ramFree) + ' / ' + fmtMB(sysInfo.ramTotal); } },
      { label: t('almacenamiento'), type: 'info',
        value: function () { return fmtMB(sysInfo.diskFree) + ' / ' + fmtMB(sysInfo.diskTotal); } },
      { label: t('modelo'), type: 'info', value: function () { return sysInfo.model || '—'; } },
      { label: t('android'), type: 'info', value: function () { return sysInfo.android || '—'; } },

      { type: 'section', label: t('apps') },
      { label: t('appsInstaladas'), type: 'info',
        value: function () { return String(Object.keys(appIndex).length); } },
      { label: t('gestionar'), type: 'act', act: function () { valen.open('apps'); } },

      { type: 'section', label: t('avanzado') },
      { label: t('ajustesSistema'), type: 'act', act: function () { valen.open('settings'); } },
      { label: t('pantallaSonido'), type: 'act', act: function () { valen.open('display'); } },
      { label: t('acerca'), type: 'act', act: function () { valen.open('about'); } }
    ];

    rowsEl.innerHTML = '';
    rowDefs = [];
    ri = 0;

    spec.forEach(function (item) {
      if (item.type === 'section') {
        var hd = document.createElement('div');
        hd.className = 'sect';
        hd.textContent = item.label;
        rowsEl.appendChild(hd);
        return;
      }
      var idx = rowDefs.length;
      var row = document.createElement('div');
      row.className = 'row';
      var lab = document.createElement('div');
      lab.className = 'lab';
      lab.textContent = item.label;
      var val = document.createElement('div');
      val.className = 'val';
      row.appendChild(lab);
      row.appendChild(val);
      item.el = row;
      item.valEl = val;
      row.addEventListener('click', function () { if (item.type !== 'info') activateRow(idx); });
      rowsEl.appendChild(row);
      rowDefs.push(item);
    });

    refreshRows();
    if (rowDefs.length) rowDefs[0].el.classList.add('focused');
  }

  function refreshRows() {
    rowDefs.forEach(function (def) {
      if (def.type === 'vol') {
        var cur = 0, max = 15;
        try { cur = valen.volGet(); max = valen.volMax() || 15; } catch (e) {}
        def.valEl.innerHTML = '<span class="vbar"><i style="width:' + Math.round((cur / max) * 100) + '%"></i></span>' +
          '<span class="vnum">' + cur + '</span>';
      } else if (def.type === 'info') {
        def.valEl.innerHTML = '<span class="cur">' + (def.value ? def.value() : '') + '</span>';
      } else if (def.type === 'seg') {
        def.valEl.innerHTML = '<span class="arw">&#8249;</span><span class="cur">' + def.values[def.get()] +
          '</span><span class="arw">&#8250;</span>';
      } else {
        def.valEl.innerHTML = '<span class="arw">&#8250;</span>';
      }
    });
  }

  function activateRow(i) {
    var def = rowDefs[i];
    if (!def) return;
    if (def.type === 'seg') {
      def.set((def.get() + 1) % def.values.length);
      saveCfg(); applyCfg();
      if (i === 0) { openSettings(); return; }
      refreshRows();
    } else if (def.type === 'act' && def.act) {
      def.act();
    } else if (def.type === 'vol') {
      tickSound();
    }
  }

  function changeRow(i, dir) {
    var def = rowDefs[i];
    if (!def) return;
    if (def.type === 'vol') {
      try { valen.volSet(valen.volGet() + dir); } catch (e) {}
      tickSound(); refreshRows(); return;
    }
    if (def.type !== 'seg') return;
    def.set((def.get() + dir + def.values.length) % def.values.length);
    saveCfg(); applyCfg();
    if (i === 0) { openSettings(); return; }
    refreshRows();
  }

  function setRowFocus(i) {
    rowDefs.forEach(function (d) { d.el.classList.remove('focused'); });
    var prev = ri;
    ri = (i + rowDefs.length) % rowDefs.length;
    rowDefs[ri].el.classList.add('focused');
    if (prev !== ri) tickSound();
    try { rowDefs[ri].el.scrollIntoView({ block: 'nearest' }); } catch (e) {}
  }

  function closeOverlay() {
    overlay.classList.remove('on');
    valen.setOverlay(false);
    mode = 'home';
    moveStage = null;
    overlayItems.forEach(function (o) { o.el.classList.remove('focused'); });
    rowDefs.forEach(function (d) { if (d.el) d.el.classList.remove('focused'); });
    setFocus(fi);
  }
  window.__closeOverlay = closeOverlay;

  function launch(app) {
    try {
      if (app && app.cmp) valen.launchCmp(app.cmp);
      else if (app && app.pkg) valen.launch(app.pkg);
    } catch (e) {}
    closeOverlay();
  }

  function focusOverlay(i) {
    if (!overlayItems.length) return;
    overlayItems.forEach(function (o) { o.el.classList.remove('focused'); });
    var prev = oi;
    oi = (i + overlayItems.length) % overlayItems.length;
    overlayItems[oi].el.classList.add('focused');
    if (prev !== oi) tickSound();
  }

  function navApps() { return overlayItems.filter(function (o) { return !o.isMove; }); }

  function focusApp(i) {
    var a = navApps();
    if (!a.length) return;
    overlayItems.forEach(function (o) { o.el.classList.remove('focused'); });
    ai = (i + a.length) % a.length;
    a[ai].el.classList.add('focused');
    tickSound();
  }

  function enterMove() {
    moveStage = 'pick';
    focusApp(0);
    ptitle.textContent = t('mover');
    hint.textContent = '◀ ▶ · OK · ' + t('vuelve');
  }

  function cancelMove() {
    moveStage = null;
    ptitle.textContent = catName(curFolder);
    hint.textContent = 'OK · ' + t('mover') + ' · ' + t('vuelve');
    if (overlayItems[0]) { overlayItems.forEach(function (o) { o.el.classList.remove('focused'); }); overlayItems[0].el.classList.add('focused'); oi = 0; }
  }

  function pickApp() {
    var a = navApps();
    if (!a.length) return;
    movePkg = a[ai].pkg;
    moveStage = 'dest';
    moveDest = 0;
    ptitle.textContent = '→ ' + catName(groups[moveDest] || '');
    hint.textContent = '▲ ▼ · OK · ' + t('vuelve');
  }

  function confirmMove() {
    if (!movePkg || !groups[moveDest]) return;
    moves[movePkg] = groups[moveDest];
    saveMoves();
    moveStage = null;
    closeOverlay();
    buildFolders();
  }

  function moveFolderNav(k) {
    if (moveStage === 'pick') {
      if (k === 22 || k === 20) focusApp(ai + 1);
      else if (k === 21 || k === 19) focusApp(ai - 1);
      else if (k === 23 || k === 66) pickApp();
      else if (k === 4 || k === 82) cancelMove();
      return;
    }
    if (moveStage === 'dest') {
      if (k === 19 || k === 20) {
        moveDest = (moveDest + (k === 19 ? -1 : 1) + groups.length) % groups.length;
        ptitle.textContent = '→ ' + catName(groups[moveDest] || '');
      } else if (k === 23 || k === 66) confirmMove();
      else if (k === 4 || k === 82) cancelMove();
      return;
    }
    if (k === 22) focusOverlay(oi + 1);
    else if (k === 21) focusOverlay(oi - 1);
    else if (k === 20) focusOverlay(oi + 4);
    else if (k === 19) focusOverlay(oi - 4);
    else if (k === 23 || k === 66) {
      var it = overlayItems[oi];
      if (!it) return;
      if (it.isMove) { if (groups.length > 1) enterMove(); }
      else launch(it);
    }
  }

  function moveSettings(k) {
    if (k === 20) setRowFocus(ri + 1);
    else if (k === 19) setRowFocus(ri - 1);
    else if (k === 22) changeRow(ri, 1);
    else if (k === 21) changeRow(ri, -1);
    else if (k === 23 || k === 66) activateRow(ri);
  }

  function moveHome(k) {
    var n = focusables.length;
    if (k === 22) setFocus(fi + 1);
    else if (k === 21) setFocus(fi - 1);
    else if (k === 19) setFocus(n - 1);
    else if (k === 20) setFocus(0);
    else if (k === 23 || k === 66) {
      var el = focusables[fi];
      if (el === gearEl) openSettings();
      else if (el) el.click();
    }
  }

  function renderVol() {
    var cur = 0, max = 15;
    try { cur = valen.volGet(); max = valen.volMax() || 15; } catch (e) {}
    volfill.style.width = Math.round((cur / max) * 100) + '%';
    volnum.textContent = cur;
  }

  function showVolHud() {
    renderVol();
    volhud.classList.add('on');
    clearTimeout(volTimer);
    volTimer = setTimeout(function () { volhud.classList.remove('on'); }, 1500);
  }

  window.__volHud = showVolHud;
  window.__vol = function (dir) {
    try { valen.volSet(valen.volGet() + dir); } catch (e) {}
    showVolHud();
  };

  window.__setWallpaper = function (uri) {
    try {
      wall.style.backgroundImage = 'url(' + uri + ')';
      cfg.wallpaper = true;
      saveCfg();
      applyCfg();
    } catch (e) {}
  };

  window.__key = function (k) {
    if (k < 0) return;
    if (k === 4) { if (mode !== 'home') closeOverlay(); return; }
    if (mode === 'folder') moveFolderNav(k);
    else if (mode === 'settings') moveSettings(k);
    else moveHome(k);
  };

  gearEl.addEventListener('click', openSettings);
  window.__refresh = function () { try { if (mode === 'home') buildFolders(); } catch (e) {} };

  applyCfg();
  (function schedule() {
    var d = new Date();
    setTimeout(function () { tick(); schedule(); }, 60000 - (d.getSeconds() * 1000 + d.getMilliseconds()) + 50);
  })();
  buildFolders();
})();
</script>

</body>
</html>
